<template>
  {{#> SideMenu 
    id="language-menu"
    side="left"
  }}
    {{#> Pane bg="blue"}}
      {{> MenuButtons inmenu="language"}}

      <nav class="nav--menu">
        <h3>{{> Icon icon="globe"}} {{__ "Language"}}</h3>
        
        <ul class="pick-list">
        {{#each languages}}
          <li>
            <a class="option{{#if (eq ../lang this)}} option--selected{{/if}}" href="{{link this ../page}}">
              <span class='badge badge--language'>{{this}}</span>
              <b>{{languagename this}}</b> / 
              {{__ (languagename this)}}
            </a>
          </li>
        {{/each}}
        </ul>

        <h3>{{> Icon icon="accessibility"}} {{__ "Accessibility"}}</h3>
        <p>
          {{> Checkbox 
            id="accessibility-dyslexie"
            name="accessibility-dyslexie" 
            label="Use Dyslexic Font" 
            var="body.dyslexie"}}

          {{!-- <label for="accessibility-dyslexie">
            
            <input type="checkbox" id="accessibility-dyslexie" autocomplete="off" data-bind="checked = body.dyslexie">
            {{__ "Use Dyslexic Font"}}
          </label> --}}
        </p>
      </nav>
    {{/Pane}}
  {{/SideMenu}}
</template>
