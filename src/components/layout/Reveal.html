<template>
  <div class="reveal reveal--{{id}}" id="{{id}}"
    {{#if cond}}
    bind="show = {{cond}}"
    {{/if}}
  >
    {{> @partial-block }}
  </div>
</template>

<style>
.reveal {
  display: none;

  &.reveal--show, &[data-show='true'] {
    display: block;
  }
}
</style>

<script>
on('.reveal', 'reveal', (evt) => {
  let reveal = evt.target;
  
  reveal.classList.add('reveal--show');
});
on('.reveal', 'close', (evt) => {
  let reveal = evt.target;
  reveal.classList.remove('reveal--show');
})
</script>
