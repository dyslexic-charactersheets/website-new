<template>
  {{#> Button 
    id=(str "item-${id}" id=(slug item.id item))
    type="tile-light"
    cls=(str "${cls} form-select-item-button ${size}" cls=(default cls '') size=(default item.size ''))
    on-click=(str "emit form-select,close-menu ${id}" id=item.id)
    data=(de_i18n item.meta)
  }}
    {{#if (eq (default show "small") "full")}}
      {{> Picture src=(str "/images/options/${id}.png" id=item.id) size="tile" transparent=true lazy=true}}

      <h4>{{__ item.name}}</h4>
    {{/if}}
    {{#if (eq (default show "small") "small")}}
      <h4>{{__ item.name}}</h4>
    {{/if}}
    {{#if showbadge}}
      <span class="button__badge">
        <img src="{{str '/images/options/badge/${id}.png' id=item.id}}">
      </span>
    {{/if}}

  picture {

  }

    picture {
      img {
        height: 8rem;
        margin-top: 4rem;
      }
    }
  }

  &.medium-figure {
    picture {
      img {
        height: 10rem;
        margin-top: 2rem;
      }
    }
  }

  .button__badge {
    display: flex;
    position: absolute;
    bottom: -0.5rem;
    left: -0.5rem;

    overflow: hidden;
    background: #f7f4ef;
    border-radius: 3rem;
    width: 3.5rem;
    height: 3.5rem;

    flex-direction: column;

    align-items: center;

    box-shadow: 0 0.1rem 0.25rem rgba(0, 0, 0, 0.5);
