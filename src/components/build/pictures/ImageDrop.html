<template>
  <div class="image-drop image-drop--shape_{{shape}} image-drop--target_{{target}}" id="{{id}}">
    <input type="hidden" name="data-image-{{id}}" id="data-image-{{id}}" autocomplete="off"{{#if value}} value="{{value}}"{{/if}}/>
    {{#if label}}
      <p>{{__ label}}</p>
    {{/if}}
    <img src="{{placeholder}}">
    {{#if imageselect}}
      {{#> Button type="primary" on-click=(default button-action "emit select-image")}}
        {{__ button}}
      {{/Button}}
    {{/if}}
    {{#if skippable}}
      <label for="no-{{id}}">
        <input type="checkbox" id="no-{{id}}" class="image-drop__no-image" name="no-{{id}}" data-var="no-{{id}}" autocomplete="off">
        {{__ skippable}}
      </label>
    {{/if}}
  </div>
</template>

<script>

let debug = getDebug('ImageDrop');
enableDebug('ImageDrop');

on(".image-drop", "dragover", (evt) => {
  evt.preventDefault();
  evt.stopPropagation();
  evt.target.classList.add('image-drop--ready');
  debug.log("Drag on");
});

on(".image-drop", "dragleave", (evt) => {
  evt.preventDefault();
  evt.stopPropagation();
  evt.target.classList.remove('image-drop--ready');
  debug.log("Drag off");
});

on(".image-drop", "drop", (evt) => {
  debug.log("Image dropped");

  // TODO check image size! 20MB limit
  
  evt.preventDefault();
  evt.stopPropagation();

  let imageDrop = evt.target;
  imageDrop.classList.remove('image-drop--ready');
  
  let noImageCheckbox = imageDrop.querySelector('.image-drop__no-image');
  if (noImageCheckbox) {
    noImageCheckbox.checked = false;
    imageDrop.classList.remove('image-drop--no-image');
  }

  var files = evt.dataTransfer.files;
  if (files.length > 0) {
    var file = files[0];
    switch (file.type) {
      case 'image/png':
      case 'image/jpeg':
      case 'image/webp':
        var reader = new FileReader();
        reader.onload = function(e) {
          var data = e.target.result;
          debug.log("I have data!");

          let input = imageDrop.querySelector('input');
          input.value = data;

          for (let img of imageDrop.querySelectorAll('img')) {
            img.src = data;
          }
        }
        reader.readAsDataURL(file);

        break;
    }
  }
});

on('.image-drop__no-image', 'change', (evt) => {
  let checkbox = evt.target;
  let noImage = checkbox.checked;
  let imageDrop = checkbox.closest('.image-drop');
  imageDrop.classList.toggle('image-drop--no-image', noImage);
})

</script>

<style>

@use 'fonts';
@use 'colours';

.image-drop {
  border: 1px solid colours.$light;
  border-radius: 0.4rem;
  padding: 1rem;
  box-shadow: inset 0 0.1rem 0.25rem colours.$shade;
  
  background-color: colours.$drop-zone;
  background-image: url(/images/white-spot.png);
  background-repeat: no-repeat;
  background-size: 130% 130%;
  background-position: 50% 50%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: space-between;

  p {
    color: black;
    text-shadow: 0 0 20px white;
    font-weight: bold;
    pointer-events: none;
  }

  img {
    pointer-events: none;

    mix-blend-mode: darken;
    min-width: 60%;
    min-height: 60%;
    max-height: 90%;
    max-width: 90%;
  }

  &.image-drop--no-image {
    img {
      opacity: 20%;
    }
  }

  &.image-drop--ready {
    background: rgba(120, 220, 255, 0.9) url(/images/white-spot.png) 50% 50% no-repeat;
  }

  &.image-drop--shape_portrait {
    height: 30rem;
  }

  &.image-drop--shape_logo {
    height: 12rem;

    img {
      max-width: 100%;
      min-width: 80%;
      min-height: auto;
    }
  }

  &.image-drop--shape_animal {
    height: 20rem;
  }
}

</style>
