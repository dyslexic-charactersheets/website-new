<template>
  {{#> SideMenu
    id="download-menu"
    cls="download-menu"
    side="right"
    wide=false
  }}
    {{#> Pane bg="parchment"}}

      <div class="spacer"></div>

      <div class="hero">
        <h2>{{__ "Downloading"}}...</h2>
      </div>

      {{#> If bind="body.isLoggedIn"}}
        {{#> Badge colour="green"}}{{> Icon icon="user"}}{{__ "Logged In"}}{{/Badge}}

        <p>{{__ "Thank you"}}</p>
      {{/ If}}

      {{#if fillable}}
        {{#> If bind="body.isLoggedIn|not"}}
          {{#> Button type="borderless" on-click="body.currentMenu = login-menu" cls="login-menu-button"}}{{> Icon icon="user"}}{{__ "Login"}}{{/Button}}

          <p>{{__ "Want to fill in your character sheets on screen? Patrons can do that."}}</p>
        {{/ If}}
      {{else}}
        <p>{{__ "This is a PDF character sheet, for printing. Only Pathfinder 2e and Starfinder 2e sheets can be filled in online."}}</p>
      {{/if}}

      {{#> If bind="#body.downloadStatus | eq 'in-progress'"}}
        <p>{{__ "Building character sheet"}}</p>
      {{/If}}

      {{#> If bind="#body.downloadStatus | eq 'ready'"}}
        <p>{{__ "Ready!"}}</p>
      {{/If}}

      
      
      <div class="spacer"></div>

    {{/Pane}}
  {{/SideMenu}}
</template>
