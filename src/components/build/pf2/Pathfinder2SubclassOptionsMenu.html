<template>
  {{!-- {{{dump select}}} --}}
  {{#> SideMenu
    id=(str "form-select-${key}" key=(slug key))
    cls="form-select-menu form-select-menu-options"
    side="right"
    wide=false
    data=(item selectcode=(camelCase select.select))
  }}
    {{#> Pane bg="parchment" nopad=true}}
      {{#> HeaderRow}}
        {{#> Row}}
          {{> CloseButton }}
          <h3>{{__ select.name "Menu title"}}</h3>
        {{/Row}}
      {{/HeaderRow}}

      {{#> ScrollPane}}
        {{#> CentrePane}}
          {{#> ItemList id=(str "${id}-items" id=id) show=../show}}
            {{{dump select}}}
            {{#each select.displayGroups}}
              <h3>{{__ group "Display Group"}}</h3>
              <div class="item-list__group">
                {{#each values}}
                  <label for="class-option--{{kebabCase ../../select.select}}--{{kebabCase group}}--{{code}}" class="btn--tile-light">
                    <input type="checkbox" 
                      id="class-option--{{kebabCase ../../select.select}}--{{kebabCase group}}--{{code}}"
                      data-select="{{../../select.select}}"
                      data-value="{{id}}"
                      autocomplete="off"
                    >
                    {{__ name}}
                  </label>
                {{/each}}
              </div>
            {{/each}}
          {{/ItemList}}
        {{/CentrePane}}
      {{/ScrollPane}}
    {{/Pane}}
  {{/SideMenu}}
</template>

<script>

on('.form-select-menu-options input[type=checkbox]', 'change', (evt) => {
  let checkbox = evt.target;
  let menu = checkbox.closest('.form-select-menu');

  let selectCode = menu.dataset.selectcode;
  let value = checkbox.dataset.value;
  setToggleInList("#build-form", selectCode, value, checkbox.checked);
});

</script>
