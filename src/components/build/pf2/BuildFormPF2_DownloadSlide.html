<template>
  <h2>{{__ "Download"}}</h2>

  <h4>{{__ "International"}}</h4>
  <fieldset>
    <p>{{__ "Language"}}: &nbsp; <span class="badge badge--language">{{ lang }}</span> {{__ (languagename lang)}}</p>
    <p>{{__ "Measurement units"}}: 
      <select name="units">
      <option selected id='units-default'>{{__ "Default"}} ({{__ "feet"}})</option>
      <option value="imperial">{{__ "Imperial"}} ({{__ "feet"}})</option>
      <option value="metric">{{__ "Metric"}} ({{__ "metres"}})</option>
      {{!-- <option value="chinese">{{__ "Chinese"}} ({{__ "步"}})</option> --}}
      </select>
    </p>
  </fieldset>

  <h4>{{__ "Format"}}</h4>
  <fieldset>
    <div class="columns">
      <div class="column">
        {{> Radio name=(str "${type}-download-format" type=type) var=(str "${type}DownloadFormat" type=type) value="html" checked=true label="HTML"}}
        <p class='info'>{{__ "Allows values to be filled in"}}</p>
        <p class='info'>{{__ "Adjusts to fit your paper size"}}</p>
      </div>
      <div class="column">
        {{> Radio name=(str "${type}-download-format" type=type) var=(str "${type}DownloadFormat" type=type) value="pdf" label="PDF"}}
        <p class='info'>{{__ "Use this if you have trouble printing HTML"}}</p>
        <p class='info'>
          <b>{{__ "Paper size:"}}</b>
          {{> Radio name=(str "${type}-download-paper" type=type) var=(str "${type}DownloadPaper" type=type) value="Letter" checked=true label="US Letter" p=false}}
          {{> Radio name=(str "${type}-download-paper" type=type) var=(str "${type}DownloadPaper" type=type) value="A4" label="A4" p=false}}
        </p>
      </div>
    </div>
  </fieldset>

  {{#> Row align="centre"}}
    <button type="submit" class="place btn btn--primary button-download button-download-pf2" data-type="{{ type }}">{{__ "Download"}}</button>
  {{/Row}}
</template>

<script>
on('.button-download-pf2', 'click', (evt) => {
  evt.preventDefault();

  let btn = evt.target;
  let type = btn.dataset.type;
  readPf2FormAndSubmit(type);
});
</script>
