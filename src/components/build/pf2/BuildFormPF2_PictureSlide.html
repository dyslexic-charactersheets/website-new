<template>
  <h2>{{__ "Picture"}}</h2>

  {{#> Columns}}
    {{#> Column}}
      <h3>{{__ "Character Picture"}}</h3>
      {{> ImageDrop 
        id=(str "${type}-portrait" type=type)
        shape="portrait"
        target="portrait"
        label="Drag Picture"
        imageselect="portrait"
        button="Select Picture"
        button-action="#body.currentMenu=portrait-menu"
        placeholder="/images/generic.png"
        skippable="No picture"
      }}
    {{/Column}}

    {{#> Column}}
      {{#if (default show-logo true)}}
        <h3>{{__ "Logo"}}</h3>
        {{> ImageDrop 
          id=(str "${type}-logo" type=type)
          shape="logo" 
          target="logo"
          label="Drag Logo" 
          imageselect="logo" 
          placeholder="/images/pathfinder2e.png"
          value="logos/pathfinder2e.png"
          button="Select Logo"
          button-action="#body.currentMenu=logo-menu"
          skippable="No logo"
        }}
      {{/if}}
      
      {{#if (default show-animal false)}}
        <h3>{{__ "Animal"}}</h3>
        {{> ImageDrop 
          id=(str "${type}-animal" type=type)
          shape="animal" 
          target="animal"
          label="Drag Animal Picture" 
          imageselect="animal" 
          button="Select Animal Picture"
          button-action="#body.currentMenu=animal-menu"
        }}
      {{/if}}
    {{/Column}}
  {{/Columns}}
</template>
