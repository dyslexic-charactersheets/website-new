<template>
  
{{#> BuildLayout game="pathfinder2" theme=theme}}
{{#> Left responsive=true id="pathfinder2left"}}
  {{#> Pane bg=(ifeq theme "scifi" "starfield" "parchment") shadow="left"}}
    {{> MenuButtons}}

    {{#> Switch
      id="switch-milestones"
      current="pick"
      var="#build-form.pick | default 'character'"
    }}

      {{#> SwitchCase value="character"}}
        {{> Milestones
          id="milestones-character"
          current="pick"
          scroll-target="#slides-character"
          milestones=(array 
            (item milestone="pick" title="Start" scrollto="slides-character-slide-pick")
            (item milestone="character" title="Character" scrollto="slides-character-slide-character")
            (item milestone="pages" title="Pages" scrollto="slides-character-slide-pages")
            (item milestone="colours" title="Appearance" scrollto="slides-character-slide-colours")
            (item milestone="picture" title="Picture" scrollto="slides-character-slide-picture")
            (item milestone="download" title="Download" scrollto="slides-character-slide-download")
          )
        }}
      {{/SwitchCase}}

      {{#> SwitchCase value="gm"}}
        {{> Milestones
          id="milestones-gm"
          current="gm-pick"
          scroll-target="#slides-character"
          milestones=(array
            (item milestone="pick" title="Start" scrollto="slides-character-slide-pick")
            (item milestone="gm-pick" title="GM" scrollto="slides-character-slide-gm-pick")
            (item milestone="gm-options" title="Options" scrollto="slides-character-slide-gm-options")
            (item milestone="gm-colours" title="Appearance" scrollto="slides-character-slide-gm-colours")
            (item milestone="gm-download" title="Download" scrollto="slides-character-slide-gm-download")
          )
        }}
      {{/SwitchCase}}

      {{#> SwitchCase value="starship"}}
        {{> Milestones
          id="milestones-starship"
          current="starship"
          scroll-target="#slides-character"
          milestones=(array
            (item milestone="pick" title="Start" scrollto="slides-character-slide-pick")
            (item milestone="starship" title="Starship" scrollto="slides-character-slide-starship")
            (item milestone="starship-colours" title="Appearance" scrollto="slides-character-slide-starship-colours")
            (item milestone="starship-download" title="Download" scrollto="slides-character-slide-starship-download")
          )
        }}
      {{/SwitchCase}}

      {{#> SwitchCase value="kingmaker"}}
        {{> Milestones
          id="milestones-kingmaker"
          current="kingmaker"
          scroll-target="#slides-character"
          milestones=(array
            (item milestone="pick" title="Start" scrollto="slides-character-slide-pick")
            (item milestone="kingmaker" title="Kingmaker" scrollto="slides-character-slide-kingmaker")
            (item milestone="kingmaker-colours" title="Appearance" scrollto="slides-character-slide-kingmaker-colours")
            (item milestone="kingmaker-download" title="Download" scrollto="slides-character-slide-kingmaker-download")
          )
        }}
      {{/SwitchCase}}

      {{#> SwitchCase value="mini"}}
        {{> Milestones
          id="milestones-mini"
          current="pick"
          scroll-target="#slides-character"
          milestones=(array
            (item milestone="pick" title="Start" scrollto="slides-character-slide-pick")
            (item milestone="mini" title="Map Figure" scrollto="slides-character-slide-mini")
            (item milestone="mini-colours" title="Appearance" scrollto="slides-character-slide-mini-colours")
            (item milestone="mini-download" title="Download" scrollto="slides-character-slide-mini-download")
          )
        }}
      {{/SwitchCase}}

    {{/Switch}}
  {{/Pane}}
{{/Left}}

{{#> Right dark=true}}
  {{#> Pane bg=(ifeq theme "scifi" "scifi" "red") nopad=true spotlight=true}}
    {{> ResponsiveMenuButtons menuid="pathfinder2left" }}
    {{> BuildFormPathfinder2 }}
  {{/Pane}}
{{/Right}}
{{/BuildLayout}}

{{> EditionMenu }}
{{> Pathfinder2AncestryMenu }}
{{#each pathfinder2.meta.heritages}}
  {{> Pathfinder2HeritageMenu key=this 
    select=(lookup ../pathfinder2.selects this) 
    versatile=(lookup ../pathfinder2.selects "heritage/versatile") 
  }}
{{/each}}
{{> Pathfinder2BackgroundMenu }}
{{> Pathfinder2ClassMenu }}
{{#each pathfinder2.meta.subclasses}}
  {{#each (array (lookup ../pathfinder2.selects this))}}
    {{#when max 'gt' 1}}
      {{> Pathfinder2SubclassOptionsMenu
        key=select
        select=(lookup ../../pathfinder2.selects this.select)
      }}
    {{/when}}
    {{#when max 'eq' 1}}
      {{> Pathfinder2SubclassMenu 
        key=select 
        select=(lookup ../../pathfinder2.selects this.select)
      }}
    {{/when}}
  {{/each}}
{{/each}}

{{> Pathfinder2ArchetypeMenu title="Multiclass" key="multiclass" select=pathfinder2.selects.multiclass}}
{{> Pathfinder2ArchetypeMenu title="Archetype" key="archetype" select=pathfinder2.selects.archetype}}

{{> ColourSelectMenu id="base-colour-menu" field="baseColour" title="Base Colour" }}
{{> ColourSelectMenu id="accent-colour-menu" field="accentColour" title="Accent Colour" }}

{{> PortraitMenu iconics=assets.iconics }}
{{> LogoMenu logos=assets.logos }}
{{> DownloadMenu }}
{{> NewCharacterMenu }}

</template>
